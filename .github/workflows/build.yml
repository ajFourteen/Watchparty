name: Build & Test

# Laeuft auf jedem Push und jeder Pull Request, damit ein roter Test sichtbar
# wird, bevor er ueberhaupt die Chance hat, auf main zu landen
# (docs/teststrategie.md, Abschnitt 10).

on:
  push:
  pull_request:
  # Erlaubt release.yml, diesen Workflow als Job einzuhaengen (jobs.needs
  # wirkt nur innerhalb einer Workflow-Datei; ueber workflow_call wird daraus
  # ein wiederverwendbarer Baustein statt einer zweiten Testdefinition).
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Volle Historie: Die Commit-Format-Pruefung unten braucht die Commits
      # zwischen Basis und Kopf, ein flacher Klon haette nur den letzten.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Der Typ der Commit-Betreffzeile entscheidet ueber Release und Deploy
      # (ADR-019). Ein nicht erkannter Typ deployed stillschweigend nicht --
      # deshalb steht diese Pruefung vor dem Bauen und nicht als Nachtrag.
      - name: Commit-Format
        run: |
          ci/commit-format-pruefen.sh \
            "${{ github.event.pull_request.base.sha || github.event.before }}" \
            "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Das Frontend wird hier gebaut, obwohl `check` es mit -PskipFrontend
      # auslaesst. Der Grund ist die Reihenfolge in release.yml: build ->
      # release -> deploy. Wuerde das Frontend erst im Docker-Build entstehen
      # (Dockerfile, Stufe "frontend"), scheiterte ein Syntaxfehler in einer
      # .jsx-Datei erst *nach* dem veroeffentlichten Release -- Tag, CHANGELOG
      # und GitHub-Release waeren draussen, Produktion bliebe auf der alten
      # Version, und die Versionsnummer behauptete eine neue. Genau dieser
      # stille Auseinanderlauf wird hier abgefangen.
      # Node 22, nicht 20: Die Frontend-Ebene laeuft in jsdom, und dessen
      # undici verlangt eine neuere Node-Fassung -- unter 20 bricht schon das
      # Laden mit "webidl.util.markAsUncloneable is not a function" ab, bevor
      # ein einziger Test lief. release.yml stand ohnehin schon auf 22.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: check
        run: ./gradlew check -PskipFrontend

      # Die E2E-Ebene (docs/teststrategie.md, Abschnitt 2.7) haengt bewusst
      # nicht an `check` -- dort gilt ein Budget von zehn Minuten, ein
      # Durchlauf durch einen echten Browser kostet Minuten. Sie steht
      # deshalb hier als eigene Stufe: nach `check`, aber vor dem Release in
      # release.yml. Faellt sie um, gibt es kein Deploy.
      #
      # Postgres kommt aus Testcontainers (Abschnitt 10); der GitHub-Runner
      # bringt Docker mit, es braucht keinen Service-Container.
      - name: Browser fuer E2E
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        run: ./gradlew e2eTest

      - name: E2E-Bericht
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: build/reports/e2e

      - name: Testbericht
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

      # Grundlage fuer pages.yml (GitHub Pages, docs/teststrategie.md
      # Abschnitt 8): nur bei gruenem `check` vorhanden, also nie ein Bericht
      # ueber einen roten Lauf.
      - name: JGiven-Bericht
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jgiven-report
          path: build/reports/jgiven/test/html
