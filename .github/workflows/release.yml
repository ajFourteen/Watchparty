name: Release & Deploy

# Ausloeser ist Semantic Release, nicht jeder Push (ADR-019): nur ein Commit
# mit "fix:", "feat:" o.ae. erzeugt einen Release, und nur ein tatsaechlich
# veroeffentlichter Release loest den Fly-Deploy aus. Ein reiner "chore:"-
# oder "docs:"-Commit auf main deployed nichts.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Ruft build.yml als wiederverwendbaren Workflow auf, statt die Pruefung
  # hier zu duplizieren (Phase 0 der Teststrategie-Umsetzung). Ein roter Test
  # verhindert damit Release und Deploy, nicht erst der menschliche Blick auf
  # main.
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semrelease.outputs.new_release_published }}
      new_release_version: ${{ steps.semrelease.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semrelease
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --ha=false ist Pflicht: fly deploy legt sonst eigenmaechtig eine
      # zweite Maschine an, auch bei min_machines_running = 1 (ADR-018).
      # Zwei Maschinen waeren zwei getrennte Raeume (ADR-005).
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Gegenstueck zu --ha=false. fly.toml nennt diese Kontrolle Pflicht,
      # aber bislang nur als Kommentar ("danach `fly machines list` pruefen")
      # -- damit hing Invariante 6 daran, dass ein Mensch nachsieht. Zwei
      # Maschinen waeren zwei getrennte Mengen von Watchpartys (ADR-005).
      - name: Genau eine Maschine (Invariante 6)
        run: ci/eine-maschine-pruefen.sh watchparty-fourteen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Node 22, weil der Rauchtest das globale WebSocket ohne Flag braucht.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Der Fly-Healthcheck fragt "GET /" ab und prueft damit nur die
      # statische Auslieferung -- fly.toml sagt selbst, dass der Raum-Thread
      # damit nicht nachgewiesen ist. Dieser Schritt legt ueber die echte
      # WebSocket-Verbindung eine Watchparty an und wartet auf WELCOME und
      # STATE: Das laeuft durch RoomCommands, den Raum-Thread und die
      # Ausgangs-Queue und beweist genau das, was der Healthcheck nicht kann.
      - name: Rauchtest gegen die laufende Instanz
        run: node ci/rauchtest.mjs wss://watchparty-fourteen.fly.dev/ws
