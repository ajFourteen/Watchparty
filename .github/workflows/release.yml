name: Release & Deploy

# Ausloeser ist Semantic Release, nicht jeder Push (ADR-019): nur ein Commit
# mit "fix:", "feat:" o.ae. erzeugt einen Release, und nur ein tatsaechlich
# veroeffentlichter Release loest den Fly-Deploy aus. Ein reiner "chore:"-
# oder "docs:"-Commit auf master deployed nichts.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semrelease.outputs.new_release_published }}
      new_release_version: ${{ steps.semrelease.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semrelease
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --ha=false ist Pflicht: fly deploy legt sonst eigenmaechtig eine
      # zweite Maschine an, auch bei min_machines_running = 1 (ADR-018).
      # Zwei Maschinen waeren zwei getrennte Raeume (ADR-005).
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
